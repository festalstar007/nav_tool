services:
  nav-tool:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:31506:31506"
    environment:
      NAV_ORIGIN: https://nav.345001.xyz
    volumes:
      - nav-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  nav-data:
